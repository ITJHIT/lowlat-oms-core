name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev
      - name: configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: confirm the io_uring target was actually configured
        # If liburing were silently not found, CMakeLists.txt skips the target
        # entirely (message(STATUS ...), not an error) -- and every step below
        # would then just quietly never test it, reporting green for a
        # coverage gap rather than a pass. Asking CMake to build this exact
        # target by name fails loudly here if it does not exist, instead of
        # the smoke step three steps down silently having nothing to run.
        run: cmake --build build --config Release -j --target feed_handler_iouring
      - name: build
        run: cmake --build build --config Release -j
      - name: test
        run: ctest --test-dir build --output-on-failure
      - name: smoke-bench
        run: |
          ./build/bench_ring_buffer 500000
          ./build/bench_matching 500000
          ./build/bench_pingpong 50000
      # The two-process shared-memory path cannot be exercised by unit tests --
      # it needs a real fork and a real mmap'd segment. Small counts keep it
      # fast; a non-zero exit means the processes lost or corrupted a message.
      - name: smoke-shm-ipc
        run: |
          cat > /tmp/ci_shm.yaml <<'EOF'
          shm_name: /lloms_ci_demo
          capacity: 1024
          stream_count: 200000
          rtt_iters: 20000
          writer_core: 0
          reader_core: 1
          EOF
          ./build/shm_ipc /tmp/ci_shm.yaml
      - name: shared-memory segment was cleaned up
        run: |
          if ls /dev/shm/lloms_* 2>/dev/null; then
            echo "leaked shared-memory segment"; exit 1
          fi
          echo "no leftover segments"
      # Neither feed handler was ever driven over a real socket in CI before
      # this: their pieces (ring buffer, risk gate, matching engine) each have
      # unit tests, but the accept -> decode -> push pipeline itself did not.
      # This sends two real TCP frames -- a resting sell, then a crossing buy
      # -- to each binary and asserts the consumer thread reports the fill,
      # via a real SIGTERM and a real exit, not a kill -9 that proves nothing.
      - name: write the socket smoke-test client
        run: |
          cat > /tmp/feed_smoke.py <<'EOF'
          import socket, struct, subprocess, sys, time

          binary, port, cfg_path = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          proc = subprocess.Popen(
              [binary, cfg_path], stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          try:
              sock = None
              for _ in range(50):
                  try:
                      sock = socket.create_connection(("127.0.0.1", port), timeout=1)
                      break
                  except OSError:
                      time.sleep(0.2)
              if sock is None:
                  print(f"{binary}: could not connect to port {port}")
                  sys.exit(1)

              def frame(symbol, side, typ, price, qty):
                  return struct.pack("<IBBHqq", symbol, side, typ, 0, price, qty)

              with sock:
                  sock.sendall(frame(1, 1, 0, 100, 10))  # resting sell, qty 10 @ 100
                  sock.sendall(frame(1, 0, 0, 100, 10))  # crossing buy, qty 10 @ 100
                  time.sleep(0.5)

              # Confirm it is still alive (did not crash processing the frames)
              # before asking it to shut down.
              if proc.poll() is not None:
                  print(f"{binary}: process exited early with code {proc.returncode}")
                  sys.exit(1)

              proc.terminate()
              try:
                  out, _ = proc.communicate(timeout=10)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  print(f"{binary}: did not exit within 10s of SIGTERM")
                  sys.exit(1)

              text = (out or b"").decode(errors="replace")
              print(text)
              if "1 fills" not in text:
                  print(f"{binary}: expected exactly 1 fill, did not see it in output")
                  sys.exit(1)
              if "0 risk-rejected" not in text:
                  print(f"{binary}: the smoke order was risk-rejected, not matched")
                  sys.exit(1)
          finally:
              if proc.poll() is None:
                  proc.kill()
                  proc.wait()
          EOF
          cat > /tmp/feed_smoke.yaml <<'EOF'
          port: 19100
          max_order_qty: 1000
          max_position: 5000
          reference_price: 100
          price_band: 50
          EOF
      - name: smoke-feed-handler-epoll
        run: python3 /tmp/feed_smoke.py ./build/feed_handler 19100 /tmp/feed_smoke.yaml
      - name: smoke-feed-handler-iouring
        run: python3 /tmp/feed_smoke.py ./build/feed_handler_iouring 19100 /tmp/feed_smoke.yaml
      # epoll vs io_uring under concurrent load -- the comparison the README
      # names as not yet measured. 50 connections x 4000 frames = 200,000
      # frames = exactly 100,000 fills (see bench_feed_client.cpp's ordering
      # argument for why that count is exact, not approximate). This is a
      # shared GitHub Actions runner, not dedicated hardware -- the absolute
      # numbers are noisy; what is meaningful is the two of them run back to
      # back on the very same runner in the very same job.
      - name: write the concurrent-load bench client config
        run: |
          cat > /tmp/feed_bench.yaml <<'EOF'
          port: 19101
          max_order_qty: 1000
          max_position: 100000
          reference_price: 115
          price_band: 40
          EOF
          cat > /tmp/feed_bench.py <<'EOF'
          import subprocess, sys, time

          binary, port, cfg_path = sys.argv[1], sys.argv[2], sys.argv[3]
          server = subprocess.Popen(
              [binary, cfg_path], stdout=subprocess.PIPE, stderr=subprocess.STDOUT
          )
          try:
              # ./build/bench_feed_client itself waits out the connect retries;
              # give the server a moment to bind before the first attempt.
              time.sleep(0.5)
              client = subprocess.run(
                  ["./build/bench_feed_client", "127.0.0.1", port, "50", "4000"],
                  capture_output=True, text=True, timeout=60,
              )
              print(client.stdout)
              if client.returncode != 0:
                  print(client.stderr)
                  print(f"{binary}: bench_feed_client failed")
                  sys.exit(1)

              time.sleep(1.0)  # let the matching consumer drain the ring
              if server.poll() is not None:
                  print(f"{binary}: server exited early with code {server.returncode}")
                  sys.exit(1)

              server.terminate()
              try:
                  out, _ = server.communicate(timeout=15)
              except subprocess.TimeoutExpired:
                  server.kill()
                  print(f"{binary}: did not exit within 15s of SIGTERM")
                  sys.exit(1)

              text = (out or b"").decode(errors="replace")
              print(text)
              if "100000 fills" not in text:
                  print(f"{binary}: expected exactly 100000 fills")
                  sys.exit(1)
              if "0 risk-rejected" not in text:
                  print(f"{binary}: some orders were risk-rejected, not matched")
                  sys.exit(1)
          finally:
              if server.poll() is None:
                  server.kill()
                  server.wait()
          EOF
      - name: bench-feed-handler-epoll
        run: python3 /tmp/feed_bench.py ./build/feed_handler 19101 /tmp/feed_bench.yaml
      - name: bench-feed-handler-iouring
        run: python3 /tmp/feed_bench.py ./build/feed_handler_iouring 19101 /tmp/feed_bench.yaml

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B build
      - name: build
        run: cmake --build build --config Release -j
      - name: test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: smoke-bench
        run: |
          ./build/Release/bench_ring_buffer.exe 500000
          ./build/Release/bench_pingpong.exe 50000
